# Development environment overrides
replicaCount: 1

image:
  tag: "dev"
  pullPolicy: IfNotPresent

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false

ingress:
  enabled: true
  hosts:
    - host: api-dev.yourdomain.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

livenessProbe:
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
