apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-delay-experiment
  namespace: chaos-testing
  labels:
    experiment: network-delay
    severity: medium
spec:
  action: delay
  mode: all
  selector:
    namespaces:
      - ecommerce-prod
    labelSelectors:
      app: core-service
  delay:
    latency: '100ms'
    correlation: '25'
    jitter: '10ms'
  duration: '10m'
  direction: to
  target:
    mode: all
    selector:
      namespaces:
        - ecommerce-prod
      labelSelectors:
        app: payment-service
---
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-partition-experiment
  namespace: chaos-testing
  labels:
    experiment: network-partition
    severity: high
spec:
  action: partition
  mode: all
  selector:
    namespaces:
      - ecommerce-prod
    labelSelectors:
      app: core-service
  direction: both
  target:
    mode: all
    selector:
      namespaces:
        - ecommerce-prod
      labelSelectors:
        app: mongodb
  duration: '2m'
---
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-loss-experiment
  namespace: chaos-testing
  labels:
    experiment: network-loss
    severity: medium
spec:
  action: loss
  mode: one
  selector:
    namespaces:
      - ecommerce-prod
    labelSelectors:
      app: core-service
  loss:
    loss: '10'
    correlation: '25'
  duration: '5m'
  direction: to
  target:
    mode: all
    selector:
      namespaces:
        - ecommerce-prod
