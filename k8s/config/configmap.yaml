apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: ecommerce-prod
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  PORT: "3000"
  KAFKA_BROKERS: "kafka-0.kafka-headless.kafka.svc.cluster.local:9092,kafka-1.kafka-headless.kafka.svc.cluster.local:9092,kafka-2.kafka-headless.kafka.svc.cluster.local:9092"
  KAFKA_CLIENT_ID: "ecommerce-backend"
  KAFKA_GROUP_ID: "ecommerce-group"
  REDIS_HOST: "redis-master.ecommerce-prod.svc.cluster.local"
  REDIS_PORT: "6379"
  MONGODB_URI: "mongodb://mongo-0.mongo-headless.ecommerce-prod.svc.cluster.local:27017,mongo-1.mongo-headless.ecommerce-prod.svc.cluster.local:27017,mongo-2.mongo-headless.ecommerce-prod.svc.cluster.local:27017/ecommerce?replicaSet=rs0"
  CORS_ORIGIN: "https://yourdomain.com"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: ecommerce-staging
data:
  NODE_ENV: "staging"
  LOG_LEVEL: "debug"
  PORT: "3000"
  KAFKA_BROKERS: "kafka-0.kafka-headless.kafka.svc.cluster.local:9092"
  KAFKA_CLIENT_ID: "ecommerce-backend-staging"
  KAFKA_GROUP_ID: "ecommerce-group-staging"
  REDIS_HOST: "redis-master.ecommerce-staging.svc.cluster.local"
  REDIS_PORT: "6379"
  MONGODB_URI: "mongodb://mongo.ecommerce-staging.svc.cluster.local:27017/ecommerce"
  CORS_ORIGIN: "https://staging.yourdomain.com"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "200"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: ecommerce-dev
data:
  NODE_ENV: "development"
  LOG_LEVEL: "debug"
  PORT: "3000"
  KAFKA_BROKERS: "kafka.kafka.svc.cluster.local:9092"
  KAFKA_CLIENT_ID: "ecommerce-backend-dev"
  KAFKA_GROUP_ID: "ecommerce-group-dev"
  REDIS_HOST: "redis.ecommerce-dev.svc.cluster.local"
  REDIS_PORT: "6379"
  MONGODB_URI: "mongodb://mongo.ecommerce-dev.svc.cluster.local:27017/ecommerce"
  CORS_ORIGIN: "*"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "1000"
