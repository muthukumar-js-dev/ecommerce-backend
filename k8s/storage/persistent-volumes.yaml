# PersistentVolumeClaim Template (used by StatefulSets)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc-template
  namespace: ecommerce-prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: fast-ssd
