apiVersion: v1
kind: Service
metadata:
  name: mongo-shard3-headless
  namespace: ecommerce-prod
  labels:
    app: mongo-shard3
spec:
  clusterIP: None
  ports:
    - port: 27018
      targetPort: 27018
      name: mongodb
  selector:
    app: mongo-shard3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo-shard3
  namespace: ecommerce-prod
  labels:
    app: mongo-shard3
    shard: "3"
spec:
  serviceName: mongo-shard3-headless
  replicas: 3
  selector:
    matchLabels:
      app: mongo-shard3
  template:
    metadata:
      labels:
        app: mongo-shard3
        shard: "3"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - mongo-shard3
                topologyKey: kubernetes.io/hostname
      containers:
        - name: mongo
          image: mongo:6
          command:
            - mongod
            - --shardsvr
            - --replSet
            - shard3ReplSet
            - --bind_ip_all
            - --port
            - "27018"
          ports:
            - containerPort: 27018
              name: mongodb
          volumeMounts:
            - name: data
              mountPath: /data/db
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: username
                  optional: true
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: password
                  optional: true
          resources:
            requests:
              cpu: 1000m
              memory: 4Gi
            limits:
              cpu: 2000m
              memory: 8Gi
          livenessProbe:
            exec:
              command:
                - mongosh
                - --port
                - "27018"
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - mongosh
                - --port
                - "27018"
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 200Gi
