# Nginx Compression Configuration

apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-compression-config
  namespace: ingress-nginx
data:
  # Enable HTTP/2
  use-http2: "true"
  http2-max-field-size: "16k"
  http2-max-header-size: "32k"
  
  # Enable Brotli compression
  enable-brotli: "true"
  brotli-level: "6"
  brotli-types: "text/xml image/svg+xml application/x-font-ttf image/vnd.microsoft.icon application/json font/eot application/vnd.ms-fontobject application/javascript font/otf application/xml application/xhtml+xml text/javascript application/x-javascript text/plain application/x-font-truetype application/xml+rss image/x-icon font/opentype text/css image/x-win-bitmap"
  
  # Gzip compression
  use-gzip: "true"
  gzip-level: "6"
  gzip-types: "application/atom+xml application/javascript application/json application/rss+xml application/vnd.ms-fontobject application/x-font-ttf application/x-web-app-manifest+json application/xhtml+xml application/xml font/opentype image/svg+xml image/x-icon text/css text/plain text/x-component"
  
  # Performance tuning
  client-body-buffer-size: "128k"
  client-max-body-size: "10m"
  large-client-header-buffers: "4 16k"
  
  # Caching
  proxy-buffering: "on"
  proxy-buffer-size: "4k"
  proxy-buffers: "8 4k"
  proxy-busy-buffers-size: "8k"
  
  # Timeouts
  proxy-connect-timeout: "60"
  proxy-send-timeout: "60"
  proxy-read-timeout: "60"
  
  # Security headers
  add-headers: "X-Frame-Options: SAMEORIGIN, X-Content-Type-Options: nosniff, X-XSS-Protection: 1; mode=block"
