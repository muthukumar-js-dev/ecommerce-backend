apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-service-blue
  namespace: ecommerce-prod
  labels:
    app: core-service
    version: blue
    environment: production
spec:
  replicas: 10
  selector:
    matchLabels:
      app: core-service
      version: blue
  template:
    metadata:
      labels:
        app: core-service
        version: blue
        environment: production
    spec:
      containers:
        - name: core-service
          image: ecommerce/core-service:v1.0.0
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: VERSION
              value: "blue"
            - name: ENVIRONMENT
              value: "production"
            - name: NODE_ENV
              value: "production"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: uri
            - name: REDIS_URI
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: uri
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - core-service
                topologyKey: kubernetes.io/hostname
