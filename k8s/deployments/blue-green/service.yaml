apiVersion: v1
kind: Service
metadata:
  name: core-service
  namespace: ecommerce-prod
  labels:
    app: core-service
spec:
  selector:
    app: core-service
    version: blue  # Initially pointing to blue (stable version)
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: core-service-blue
  namespace: ecommerce-prod
  labels:
    app: core-service
    version: blue
spec:
  selector:
    app: core-service
    version: blue
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: core-service-green
  namespace: ecommerce-prod
  labels:
    app: core-service
    version: green
spec:
  selector:
    app: core-service
    version: green
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
