apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-adapter-config
  namespace: monitoring
  labels:
    app: prometheus-adapter
data:
  config.yaml: |
    rules:
      # HTTP requests per second metric
      - seriesQuery: 'http_requests_total{namespace="ecommerce-prod"}'
        resources:
          template: <<.Resource>>
        name:
          matches: "^(.*)_total$"
          as: "${1}_per_second"
        metricsQuery: 'rate(<<.Series>>{<<.LabelMatchers>>}[2m])'
      
      # HTTP request duration P95
      - seriesQuery: 'http_request_duration_seconds{namespace="ecommerce-prod",quantile="0.95"}'
        resources:
          template: <<.Resource>>
        name:
          matches: "^(.*)_seconds$"
          as: "${1}_p95"
        metricsQuery: '<<.Series>>{<<.LabelMatchers>>}'
      
      # Kafka consumer lag metric
      - seriesQuery: 'kafka_consumer_lag{namespace="ecommerce-prod"}'
        resources:
          template: <<.Resource>>
        name:
          as: "kafka_consumer_lag"
        metricsQuery: 'avg_over_time(<<.Series>>{<<.LabelMatchers>>}[2m])'
      
      # Database connection pool usage
      - seriesQuery: 'mongodb_connections_current{namespace="ecommerce-prod"}'
        resources:
          template: <<.Resource>>
        name:
          as: "db_connection_usage"
        metricsQuery: '<<.Series>>{<<.LabelMatchers>>}'
      
      # Payment processing queue length
      - seriesQuery: 'payment_queue_length{namespace="ecommerce-prod"}'
        resources:
          template: <<.Resource>>
        name:
          as: "payment_processing_queue_length"
        metricsQuery: 'avg_over_time(<<.Series>>{<<.LabelMatchers>>}[1m])'
      
      # Active user sessions
      - seriesQuery: 'active_sessions{namespace="ecommerce-prod"}'
        resources:
          template: <<.Resource>>
        name:
          as: "active_user_sessions"
        metricsQuery: '<<.Series>>{<<.LabelMatchers>>}'
