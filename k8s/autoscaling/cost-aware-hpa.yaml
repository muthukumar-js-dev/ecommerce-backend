apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: core-service-cost-aware
  namespace: ecommerce-prod
  labels:
    app: core-service
    optimization: cost-aware
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: core-service
  
  minReplicas: 3
  maxReplicas: 50
  
  metrics:
    # CPU-based scaling (70% target for cost efficiency)
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    
    # Memory-based scaling
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
    
    # Custom metric: requests per pod
    - type: Pods
      pods:
        metric:
          name: http_requests_per_pod
        target:
          type: AverageValue
          averageValue: "1000"
  
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 minutes before scaling down
      policies:
        - type: Percent
          value: 50  # Scale down max 50% at a time
          periodSeconds: 60
        - type: Pods
          value: 2  # Or max 2 pods at a time
          periodSeconds: 60
      selectPolicy: Min  # Use the most conservative policy
    
    scaleUp:
      stabilizationWindowSeconds: 0  # Scale up immediately
      policies:
        - type: Percent
          value: 100  # Can double pods
          periodSeconds: 15
        - type: Pods
          value: 4  # Or add 4 pods at a time
          periodSeconds: 15
      selectPolicy: Max  # Use the most aggressive policy
---
