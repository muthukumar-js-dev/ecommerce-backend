apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: core-service-hpa
  namespace: ecommerce-prod
  labels:
    app: core-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: core-service
  minReplicas: 3
  maxReplicas: 20
  metrics:
    # CPU-based scaling
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    
    # Memory-based scaling
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 minutes
      policies:
        # Scale down by at most 50% of current pods per minute
        - type: Percent
          value: 50
          periodSeconds: 60
        # Scale down by at most 2 pods per minute
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Min  # Use the policy that scales down the least
    
    scaleUp:
      stabilizationWindowSeconds: 0  # Scale up immediately
      policies:
        # Scale up by at most 100% of current pods per 15 seconds
        - type: Percent
          value: 100
          periodSeconds: 15
        # Scale up by at most 4 pods per 15 seconds
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max  # Use the policy that scales up the most
