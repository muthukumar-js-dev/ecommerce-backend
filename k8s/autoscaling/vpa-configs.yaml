# Vertical Pod Autoscaler Configurations

---
# VPA for Core Service
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: core-service-vpa
  namespace: ecommerce-prod
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: core-service
  updatePolicy:
    updateMode: "Off"  # Recommendation mode only, no auto-updates
  resourcePolicy:
    containerPolicies:
      - containerName: core-service
        minAllowed:
          cpu: 250m
          memory: 256Mi
        maxAllowed:
          cpu: 2000m
          memory: 2Gi
        controlledResources: ["cpu", "memory"]

---
# VPA for Payment Service
apiVersion: autoscaling.k8s.io/v1
