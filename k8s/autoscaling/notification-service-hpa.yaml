apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notification-service-hpa
  namespace: ecommerce-prod
  labels:
    app: notification-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notification-service
  minReplicas: 2
  maxReplicas: 15
  metrics:
    # CPU-based scaling
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    
    # Memory-based scaling
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 minutes
      policies:
        # Scale down by at most 50% of current pods per minute
        - type: Percent
          value: 50
          periodSeconds: 60
        # Scale down by at most 3 pods per minute
        - type: Pods
          value: 3
          periodSeconds: 60
      selectPolicy: Min
    
    scaleUp:
      stabilizationWindowSeconds: 0  # Scale up immediately for notification bursts
      policies:
        # Scale up by at most 100% of current pods per 15 seconds
        - type: Percent
          value: 100
          periodSeconds: 15
        # Scale up by at most 5 pods per 15 seconds
        - type: Pods
          value: 5
          periodSeconds: 15
      selectPolicy: Max
